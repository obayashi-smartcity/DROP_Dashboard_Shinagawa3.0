<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3e9e2" />
<title>DROP. Coach — 投稿づくりチャット（B案）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  /* =====================================================================
     デザイン（v5・2026/11/16）みんまちDROP の雰囲気に合わせた
     - 色：生成りの背景・白い大きな角丸カード・こげ茶のボタン。差し色は DROP のしずくの 5 色（橙・桃・黄・水・緑）＝5 つの「ことばのかけら」
     - チャットは LINE のように：あなた（利用者）＝こげ茶の吹き出し／ぽとり（案内役）＝白の吹き出し。下の答える欄も同じ
       （ぽとりの問い・確かめ＝白／あなたが選んだもの・送るボタン＝こげ茶）
     - かけら集めはダンジョン風：5 つの部屋をまわって、かけらを集める。上の地図で「いまどこか」「どれだけ集まったか」が見える
       自分のことばで答えるとキラかけら✦、任意の問い（ひみつの部屋）はレアかけら。5 つそろうと DROP の原石が完成
     - 案内役「ぽとり」：DROP の色ガラスのようなしずく（オリジナル）。話し方は「〜だよ」（右上の「関西弁」でワンタップ切りかえ）
     - 運営からのお知らせ（個人情報のおねがい・本数）は、キャラにしゃべらせず、まん中のお知らせ枠で出す
  ===================================================================== */
  :root{
    --bg:#f3e9e2; --bg-2:#ebded4; --card:#fff; --paper:#fbf7f3;
    --line:#e0d1c6; --line-2:#efe5de;
    --ink:#2b211d; --ink-2:#5c4b43; --dim:#6b5d55;
    --brown:#4e3b38; --brown-2:#665049; --brown-soft:#efe5df;
    --g1:#f08c4e; --g2:#ec8fb1; --g3:#f2c64a; --g4:#4fbcd4; --g5:#72ad48; --gold:#e3a92b;
    --ok:#2f6b4a; --warn:#8a5f00; --err:#b3372a;
    --sh-1:0 1px 2px rgba(60,40,30,.05),0 6px 18px rgba(60,40,30,.06);
    --sh-2:0 -10px 30px -14px rgba(60,40,30,.35);
    --font:"Zen Kaku Gothic New","Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;
    --serif:"DM Serif Display",Georgia,"Times New Roman",serif;
    --dockH:220px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;font-weight:500;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button,input,textarea{font-family:var(--font);color:inherit}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  svg{flex:none}
  :focus-visible{outline:3px solid rgba(78,59,56,.45);outline-offset:2px}
  html.big .chat, html.big .dock-head, html.big .dock-scroll, html.big .dock-act, html.big .sheet{zoom:1.15}
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

  /* ---------- 上部：ロゴと「かけらの地図」 ---------- */
  .top{position:sticky;top:0;z-index:30;background:rgba(243,233,226,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .appbar-in{max-width:640px;margin:0 auto;padding:6px 8px 2px 14px;display:flex;align-items:center;gap:10px;min-height:52px}
  .brand{display:flex;align-items:center;gap:8px;white-space:nowrap;line-height:1}
  .brand .mark{width:30px;height:30px;flex:none}
  .brand .mark svg{width:30px;height:30px;display:block}
  .brand-t{display:flex;flex-direction:column}
  .brand-t b{font-family:var(--serif);font-weight:400;font-size:21px;letter-spacing:.2px;color:var(--ink)}
  .brand-t small{display:block;font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--ink-2);margin-top:3px}
  .top-r{margin-left:auto;display:flex;align-items:center;gap:6px}
  .icon-btn{width:44px;height:44px;border:none;background:transparent;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
  .icon-btn:hover{background:var(--bg-2)}
  .icon-btn svg{width:22px;height:22px}
  .menu{position:absolute;right:12px;top:56px;z-index:40;background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(60,40,30,.22);padding:6px;display:flex;flex-direction:column;min-width:240px}
  .menu button{border:none;background:none;text-align:left;padding:13px 14px;border-radius:12px;font-size:15px;font-weight:700;color:var(--ink)}
  .menu button:hover{background:var(--brown-soft)}
  /* 関西弁ボタン（ワンタップで切りかえ） */
  .voice-btn{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap}
  .voice-btn .vd{display:none!important}   /* B 案：関西弁ボタンは小さく・目立たなく（オンのときだけこげ茶） */
  .voice-btn.on{background:var(--brown);color:#fff!important;border-color:var(--brown)}
  .voice-btn .vd{position:relative;width:28px;height:16px;border-radius:999px;background:#cbbcb1;transition:background .2s;flex:none}
  .voice-btn .vd::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s}
  .voice-btn.on{border-color:var(--brown);color:var(--ink)}
  .voice-btn.on .vd{background:var(--brown)}
  .voice-btn.on .vd::after{transform:translateX(12px)}
  .staff-flag{font-size:10px;font-weight:800;letter-spacing:1px;color:#fff;background:var(--warn);padding:3px 7px;border-radius:4px}
  /* かけらの地図：5 つの部屋（宝石）を道でつなぐ。最後に DROP（宝箱）。押すと、いまの投稿イメージ */
  .quest{display:block;width:100%;border:none;background:none;padding:0 10px 8px;text-align:left}
  .quest-in{max-width:620px;margin:0 auto;background:#fff;border-radius:18px;box-shadow:var(--sh-1);padding:6px 8px 5px;display:flex;align-items:center;gap:4px}
  .path{flex:1;min-width:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative}
  .path::before{content:"";position:absolute;left:10%;right:10%;top:13px;border-top:2px dashed var(--line)}
  .path .walk{position:absolute;left:10%;top:12px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g5));transition:width .6s ease;max-width:80%}
  .node{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
  .node .gem{width:28px;height:28px;display:block;position:relative;z-index:1}
  .node .gem svg{width:28px;height:28px;display:block}
  .node i{font-style:normal;font-size:11px;font-weight:800;color:var(--ink-2);white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}
  .node.got i{color:var(--ink)}
  .node.now i{color:var(--ink)}
  .node.now .gem::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--brown);animation:nowring 1.6s ease-in-out infinite}
  @keyframes nowring{50%{transform:scale(1.12);opacity:.45}}
  .node .kira{position:absolute;right:calc(50% - 21px);top:-4px;font-size:12.5px;color:#c98a00;font-weight:900;z-index:2;text-shadow:0 0 3px #fff,0 0 3px #fff}
  .node.pop .gem{animation:gempop .7s cubic-bezier(.2,1.6,.4,1)}
  @keyframes gempop{0%{transform:scale(.3) rotate(-30deg)}60%{transform:scale(1.35) rotate(8deg)}100%{transform:none}}
  .node.pop .gem::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(255,215,120,.9) 0 18%,transparent 19% 100%),conic-gradient(from 0deg,transparent 0 10%,rgba(240,140,78,.6) 10% 13%,transparent 13% 35%,rgba(79,188,212,.6) 35% 38%,transparent 38% 60%,rgba(236,143,177,.6) 60% 63%,transparent 63% 85%,rgba(114,173,72,.6) 85% 88%,transparent 88%);animation:burst .8s ease-out forwards;z-index:-1}
  @keyframes burst{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.8);opacity:0}}
  .chest{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;gap:1px;border-left:1px dashed var(--line);padding-left:4px}
  .chest svg{width:30px;height:28px;display:block}
  .chest i{font-style:normal;font-family:var(--serif);font-size:11.5px;color:var(--ink-2);line-height:1.1}
  .chest.full svg{animation:glow 1.8s ease-in-out infinite}
  @keyframes glow{50%{filter:drop-shadow(0 0 6px rgba(227,169,43,.9))}}
  .iab{background:#fff8e6;border-top:1px solid #f0d58f;color:#5c4300;font-size:13.5px;line-height:1.55}
  .iab-in{max-width:640px;margin:0 auto;padding:8px 12px 8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .iab-in span{flex:1;min-width:200px}
  .iab .btn{min-height:44px;font-size:14px;padding:0 14px}

  /* ---------- チャット（LINE のように：ぽとり＝白・あなた＝こげ茶） ---------- */
  .chat{max-width:640px;margin:0 auto;padding:12px 12px calc(var(--dockH) + 16px)}
  .msg{display:flex;gap:8px;margin:10px 0;align-items:flex-start}
  .msg.me{justify-content:flex-end}
  .msg.wide{display:block}
  .msg.new{animation:pop .3s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .avatar{width:38px;height:38px;flex:none;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-1)}
  .avatar svg{width:32px;height:32px;display:block}
  .bubble{max-width:80%;padding:11px 15px;font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:break-word;border-radius:4px 20px 20px 20px;background:#fff;color:var(--ink);box-shadow:var(--sh-1)}
  .msg.me .bubble{background:var(--brown);color:#fff;border-radius:20px 4px 20px 20px;box-shadow:none}
  .msg.me .bubble.muted{background:transparent;color:var(--dim);font-size:13px;padding:0 4px;font-weight:700}
  .msg.me .bubble.photo{padding:0;overflow:hidden;max-width:64%;background:var(--bg-2);border-radius:20px 4px 20px 20px}
  .msg.me .bubble.photo img{display:block;width:100%;max-height:340px;object-fit:cover}
  .msg.me .bubble.photo .nophoto{display:block;padding:16px 18px;color:var(--ink-2);font-size:14px}
  .bubble .sub{display:block;margin-top:6px;font-size:13.5px;color:var(--ink-2);white-space:normal;line-height:1.6;font-weight:500}
  .typing .bubble{display:flex;gap:4px;align-items:center;padding:14px 16px}
  .typing .bubble i{width:7px;height:7px;border-radius:50%;background:var(--brown-2);animation:blink 1.1s infinite}
  .typing .bubble i:nth-child(2){animation-delay:.15s}.typing .bubble i:nth-child(3){animation-delay:.3s}
  .typing .bubble em{font-style:normal;font-size:13.5px;color:var(--ink-2);margin-left:8px}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  /* 運営からのお知らせ（キャラにしゃべらせない）：まん中の枠 */
  .notice{display:flex;gap:8px;align-items:flex-start;margin:12px auto;max-width:94%;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid var(--line);font-size:13.5px;line-height:1.65;color:var(--ink-2)}
  .notice b{color:var(--ink)}
  .notice svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--ink-2)}
  .notice.ann{justify-content:center;text-align:center;flex-direction:column;align-items:center;gap:2px;max-width:86%}
  .notice.ann b{font-size:15.5px;font-weight:900}
  .notice.ann small{font-size:12px;color:var(--dim)}
  /* 部屋に入る（ダンジョンの区切り） */
  .room{display:flex;align-items:center;gap:10px;margin:18px 4px 6px;color:var(--ink-2)}
  .room::before,.room::after{content:"";flex:1;height:0;border-top:1.5px dashed var(--line)}
  .room span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;letter-spacing:.5px;white-space:nowrap}
  .room span svg{width:20px;height:20px}
  .room small{font-size:12px;font-weight:700;color:var(--dim)}
  .room.secret span{color:#8a5f00}
  /* かけらゲット */
  .get{display:flex;justify-content:center;margin:8px 0 4px}
  .get-in{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 14px 6px 8px;box-shadow:var(--sh-1);font-size:14px;font-weight:900;color:var(--ink)}
  .get-in svg{width:30px;height:30px}
  .get.new .get-in svg{animation:gempop .8s cubic-bezier(.2,1.6,.4,1)}
  .get.new .get-in{animation:getin .5s ease}
  @keyframes getin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
  .get-in em{font-style:normal;font-size:12px;font-weight:900;color:#7a5200;background:#fdecc1;border-radius:999px;padding:2px 9px}
  .get.miss .get-in{background:transparent;box-shadow:none;color:var(--dim);font-size:12.5px;font-weight:700}
  .get.miss .get-in svg{width:20px;height:20px;opacity:.6}
  /* DROP の原石が完成 */
  .done-card{background:#fff;border-radius:24px;box-shadow:var(--sh-1);padding:16px 16px 14px;text-align:center;margin:10px 0}
  .done-card .big{width:92px;height:110px;margin:0 auto 4px;display:block}
  .done-card.new .big{animation:rise 1s cubic-bezier(.2,1.4,.4,1)}
  @keyframes rise{0%{transform:translateY(20px) scale(.5);opacity:0}60%{transform:translateY(-6px) scale(1.08);opacity:1}100%{transform:none}}
  .done-card h3{margin:0;font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:.3px}
  .done-card p{margin:4px 0 0;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
  .done-card .bag{display:flex;justify-content:center;gap:4px;margin-top:8px}
  .done-card .bag svg{width:24px;height:24px}

  /* ---------- 投稿文 ---------- */
  .card{background:#fff;border-radius:24px;padding:14px;box-shadow:var(--sh-1)}
  .card-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .card-hd b{font-size:15.5px;color:var(--ink);font-weight:900}
  .post-label{font-size:12px;font-weight:900;letter-spacing:.5px;color:#fff;background:var(--brown);border-radius:999px;padding:4px 12px}
  .post-photo{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin-bottom:10px;background:var(--bg-2)}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-2);border-radius:14px;padding:3px;margin-bottom:10px}
  .seg button{border:none;background:none;border-radius:11px;padding:10px 6px;font-size:13.5px;font-weight:800;color:var(--ink-2)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .card textarea{display:block;width:100%;border:1.5px solid transparent;border-radius:14px;resize:none;font-size:17.5px;line-height:1.8;min-height:140px;outline:none;padding:6px 8px;color:var(--ink);background:var(--paper)}
  .card textarea:focus{border-color:var(--brown);background:#fff}
  .lines{display:flex;flex-direction:column;gap:6px;background:var(--paper);border-radius:14px;padding:6px}
  .ln{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;border:1.5px solid transparent;border-radius:12px;background:#fff;padding:8px 10px;font-size:17px;line-height:1.5;text-align:left;color:var(--ink)}
  .ln svg{width:18px;height:18px;margin-left:auto;color:var(--dim);flex:none}
  .ln.open{border-color:var(--brown)}
  .alts{display:flex;flex-direction:column;gap:6px;padding:2px 0 6px 12px}
  .alts button{min-height:44px;border:1.5px dashed var(--line);border-radius:12px;background:#fff;padding:8px 10px;font-size:15.5px;text-align:left;color:var(--ink);font-weight:700}
  .alts button.on{border-style:solid;border-color:var(--brown);background:var(--brown);color:#fff}
  .cmp{display:flex;flex-direction:column;gap:8px}
  .cmp-item{border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;background:#fff}
  .cmp-item.on{border:2px solid var(--brown);background:var(--paper)}
  .cmp-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .cmp-h b{font-size:14px}
  .cmp-h .btn{margin-left:auto;min-height:40px}
  .cmp-on{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--ink)}
  .cmp-t{white-space:pre-wrap;font-size:15.5px;line-height:1.75;color:var(--ink)}
  .card-foot{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .card-foot .cnt{font-size:12.5px;color:var(--dim)}
  .switch{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2);cursor:pointer;user-select:none;margin-left:auto}
  .switch input{width:20px;height:20px;accent-color:var(--brown)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
  .tag.off{background:#fff;color:var(--dim);text-decoration:line-through}
  .note{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-top:8px}
  .note.warn{color:var(--warn)}
  .ai-more{display:flex;align-items:center;gap:8px;margin:2px 0 8px;flex-wrap:wrap}
  .ai-more .lnk{padding:4px 2px;min-height:36px}
  .card.staff{border:1.5px dashed var(--warn);box-shadow:none;max-width:100%;border-radius:16px}
  .card.staff b{color:var(--warn)}
  .card.staff table{width:100%;border-collapse:collapse;font-size:13px}
  .card.staff td{border-top:1px solid var(--line-2);padding:5px 4px;vertical-align:top}
  .card.staff td:first-child{color:var(--dim);white-space:nowrap;width:1%}
  .bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12.5px}
  .bars s{display:block;height:8px;background:var(--bg-2);border-radius:4px;overflow:hidden;text-decoration:none}
  .bars s u{display:block;height:100%;background:var(--brown)}
  .card.staff pre{max-height:240px;overflow:auto;background:var(--bg);padding:8px;font-size:11px;border-radius:8px;white-space:pre-wrap;word-break:break-all}
  /* 本日の DROP：ステンドグラス（バラ窓。通算の本数で育つ） */
  .card.stamp .stamp-n{margin-left:auto;font-weight:900;color:var(--ink-2);font-size:13.5px}
  .glass{width:100%;max-width:320px;aspect-ratio:1/1;margin:2px auto 10px;border-radius:16px;overflow:hidden;transition:background .8s}
  .glass.day{background:radial-gradient(circle at 50% 46%,#FFFDF8 0%,#F1E8D8 78%)}
  .glass.night{background:radial-gradient(circle at 50% 46%,#26346A 0%,#0B1130 78%)}
  .glass svg{width:100%;height:100%;display:block}
  .glass-sub{margin:2px 0 0;font-size:14px;color:var(--ink-2);line-height:1.7}
  .glass-night{margin:6px 0 0;font-size:12.5px;color:var(--dim)}
  .sg-pop{transform-box:fill-box;transform-origin:center;animation:sgPop .75s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes sgPop{0%{transform:scale(.15);opacity:0}55%{opacity:1}100%{transform:scale(1);opacity:1}}
  .sg-fade{animation:sgFade 1s ease-out both}
  @keyframes sgFade{from{opacity:0}to{opacity:1}}
  .sg-glint{animation:sgGlint 1s ease-out both;pointer-events:none}
  @keyframes sgGlint{0%{opacity:0}35%{opacity:.85}100%{opacity:0}}
  .sg-spark{transform-box:fill-box;transform-origin:center;animation:sgSpark 1.3s ease-out both}
  @keyframes sgSpark{0%{transform:scale(0) rotate(0);opacity:0}40%{transform:scale(1.3) rotate(45deg);opacity:1}100%{transform:scale(0) rotate(90deg);opacity:0}}
  .sg-hint{animation:sgHint 1.8s ease-in-out infinite}
  @keyframes sgHint{0%,100%{opacity:.25}50%{opacity:.8}}
  .sg-tw{animation:sgTw 2.6s ease-in-out infinite}
  @keyframes sgTw{0%,100%{opacity:.15}50%{opacity:.95}}
  .sg-rays{animation:sgSpin 60s linear infinite}
  @keyframes sgSpin{to{transform:rotate(360deg)}}
  /* あいさつの注記・行ってみるリストのボタン・写真のえらびなおし */
  .sysnote{margin:-4px 0 10px 46px;font-size:12px;color:var(--dim);line-height:1.6}
  .want-btn{display:inline-flex;align-items:center;gap:4px;margin-top:8px;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--brown);background:#fff;color:var(--brown);font-size:14px;font-weight:900;cursor:pointer}
  .pick-col{display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:64%}
  .pick-col .bubble.photo{max-width:100%}
  .repick{min-height:32px;padding:2px 4px;font-size:12.5px}
  .post-photo-wrap{position:relative}
  .photo-chg{position:absolute;right:8px;top:8px;min-height:32px;padding:4px 12px;border-radius:999px;border:none;background:rgba(43,33,29,.72);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer}
  .stamp-msg{margin:0;font-size:15.5px;line-height:1.7;font-weight:700}
  .stamp-ai{margin:8px 0 0;font-size:14px;color:var(--ink-2);line-height:1.6;display:flex;gap:8px;align-items:flex-start}
  .stamp-ai .avatar{width:28px;height:28px;box-shadow:none;background:var(--paper)}
  .stamp-ai .avatar svg{width:24px;height:24px}
  /* おまけ：宝箱（おすすめ） */
  .treasure{text-align:center}
  .treasure .chest-big{width:96px;height:84px;margin:4px auto 0;display:block}
  .treasure.shake .chest-big{animation:wiggle 1.4s ease-in-out infinite}
  @keyframes wiggle{0%,70%,100%{transform:none}75%{transform:rotate(-6deg)}85%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}
  .treasure h3{margin:6px 0 0;font-size:17px;font-weight:900}
  .treasure p{margin:4px 0 10px;font-size:14px;color:var(--ink-2);line-height:1.6}
  .treasure.opened{text-align:left}
  .treasure.opened .tr-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .treasure.opened .tr-hd svg{width:44px;height:40px;animation:rise .8s ease}
  .treasure.opened .tr-hd b{font-size:15.5px;font-weight:900;display:block}
  .treasure.opened .tr-hd small{font-size:12.5px;color:var(--ink-2)}
  .recs{display:flex;flex-direction:column;gap:10px}
  .rec{position:relative;border-radius:18px;border:1.5px solid var(--line-2);background:var(--paper);padding:12px 12px 10px 14px;overflow:hidden;animation:pop .45s ease both}
  .rec:nth-child(2){animation-delay:.12s}.rec:nth-child(3){animation-delay:.24s}
  .rec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--k,var(--g1))}
  .rec .kind{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;color:#fff;background:var(--kd,#b9531c);border-radius:999px;padding:2px 10px}
  .rec h4{margin:6px 0 0;font-size:16.5px;font-weight:900;line-height:1.45}
  .rec .who{font-size:12.5px;color:var(--dim);font-weight:700;margin-top:1px}
  .rec .place{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--ink);margin-top:6px}
  .rec .place svg{width:15px;height:15px;color:var(--ink-2)}
  .rec .desc{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:4px 0 0}
  .rec .why{font-size:13.5px;line-height:1.6;color:var(--ink);margin:6px 0 0;font-weight:700}
  .rec .why::before{content:"✦ ";color:var(--gold)}
  .rec .row{margin-top:8px}
  .rec .btn{min-height:44px;font-size:14px}
  .rec .btn.saved{background:var(--brown);color:#fff;border-color:var(--brown)}
  .tr-foot{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:8px}
  .tr-note{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin:8px 0 0}
  .tr-note a{color:var(--ink);font-weight:800}
  /* 運営からの 2 問（会社の見え方・使いごこち） */
  .rate{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
  .rate:first-of-type{border-top:none;margin-top:0;padding-top:0}
  .rate-q{margin:0 0 8px;font-size:14.5px;font-weight:800;color:var(--ink)}
  .rate-q small{display:inline-block;margin-left:6px;font-size:11.5px;color:var(--dim);font-weight:700}
  .rate-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .rate-btns button,.pulse-btns button{height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:900;font-size:16px;color:var(--ink)}
  .rate-btns button.on,.pulse-btns button.on{background:var(--brown);border-color:var(--brown);color:#fff}
  .rate-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
  .rate-sel{margin:8px 0 6px;font-size:13.5px;color:var(--ink);font-weight:800}
  .rate textarea::placeholder{color:#8f8177}
  .rate textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;font-size:16px;resize:none;background:#fff;min-height:0;line-height:1.5}
  .pulse-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .pulse-btns button{font-size:15px}
  .rate-done{margin:0;font-size:14px;color:var(--ink);font-weight:700}

  /* ---------- 答える欄（下）。ぽとりの問い＝白いカード／あなたが選んだもの・送る＝こげ茶 ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
  .dock-in{pointer-events:auto;max-width:640px;margin:0 auto;background:var(--bg-2);border-radius:26px 26px 0 0;box-shadow:var(--sh-2);padding:6px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px)}
  .grab{display:flex;align-items:center;justify-content:center;width:100%;height:22px;margin:-2px 0 4px;border:none;background:none;padding:0;touch-action:none;cursor:grab}
  .grab::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#cdbcb0}
  .grab:hover::before{background:var(--brown-2)}
  .dock-mini{display:none;align-items:center;gap:8px;min-height:44px;cursor:pointer;background:#fff;border-radius:16px;padding:4px 12px}
  .dock-mini .mq{flex:1;min-width:0;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dock-mini .mo{font-size:13.5px;font-weight:900;color:#fff;background:var(--brown);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .dock-mini svg{width:22px;height:22px}
  .dock-in.collapsed .dock-head,.dock-in.collapsed .dock-scroll,.dock-in.collapsed .dock-act{display:none}
  .dock-in.collapsed .dock-mini{display:flex}
  .dock-in.collapsed{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  body.editing .dock{display:none}
  .dock-head{flex:none;margin:0 0 8px}
  .q-card{background:#fff;border-radius:6px 18px 18px 18px;padding:9px 12px 10px;box-shadow:var(--sh-1);display:flex;gap:8px;align-items:flex-start}
  .q-card .avatar{width:30px;height:30px;box-shadow:none;background:var(--paper)}
  .q-card .avatar svg{width:26px;height:26px}
  .q-card .qc{flex:1;min-width:0}
  .q-meta{display:flex;align-items:center;gap:8px;min-height:24px}
  .q-title{font-size:17px;font-weight:900;line-height:1.5;margin-top:2px;color:var(--ink);animation:pop .3s ease}
  .q-sub{font-size:13px;color:var(--ink-2);line-height:1.55;margin-top:2px}
  .q-step{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;color:var(--ink);white-space:nowrap}
  .q-step svg{width:18px;height:18px}
  .q-step.opt{color:#8a5f00}
  .q-ins{font-size:12.5px;color:var(--dim);font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dock-head .lnk{padding:2px 0;min-height:28px;font-size:12.5px;color:var(--ink-2)}
  .dock-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 1px 4px}
  .dock-act{flex:none;padding-top:10px}
  .dock-act .row{margin-top:0}
  /* 選択肢：ぽとりが出した候補＝白／あなたが選んだもの＝こげ茶 */
  .chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;gap:8px}
  .chip{position:relative;min-height:52px;padding:10px 12px;border:1.5px solid var(--line);border-radius:16px;background:#fff;font-size:15.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;text-align:left;line-height:1.35;transition:background .12s,border-color .12s}
  .chip.wide{grid-column:1 / -1}
  .chip:active{transform:scale(.98)}
  .chip.on{border-color:var(--brown);background:var(--brown);color:#fff}
  .chip .ord,.chip .ck{margin-left:auto;order:2;display:inline-flex;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--brown);font-size:12.5px;font-weight:900;align-items:center;justify-content:center;flex:none}
  .chip.ai{border-style:dashed;border-color:#d9c4b4}
  .chip.ai small{display:block;width:max-content;font-size:11px;font-weight:900;color:#a8481a;background:#fde3d2;border-radius:999px;padding:1px 8px;margin-bottom:3px}
  .chip.ai.on small{color:#fff;background:rgba(255,255,255,.18)}
  .chip.ai.on{border-style:solid}
  .chip.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .pii{font-size:12.5px;color:var(--dim);margin:6px 4px 0;line-height:1.5}
  .hint-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:8px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:800;font-size:14.5px}
  .hint-btn svg{width:18px;height:18px;color:var(--gold)}
  .hint-btn.open{background:var(--paper)}
  /* B 案：手が止まったら、ヒントのボタンを光らせ、ぽとりが小さく声をかける */
  .hint-btn.nudge{border-color:var(--gold);background:#fffaf0;animation:nudgeRing 1.6s ease-out 3}
  @keyframes nudgeRing{0%{box-shadow:0 0 0 0 rgba(227,169,43,.55)}100%{box-shadow:0 0 0 12px rgba(227,169,43,0)}}
  .nudge-tip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 12px 6px 6px;border-radius:4px 16px 16px 16px;background:#fff;box-shadow:var(--sh-1);font-size:13.5px;font-weight:700;color:var(--ink);animation:getin .35s ease both}
  .nudge-tip .av{width:24px;height:24px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center}
  .nudge-tip .av svg{width:20px;height:20px}
  /* B 案：とばす・ここで投稿文へ（いちばん下の白い囲み。主ボタンは入力欄の →） */
  .exits{display:flex;align-items:stretch;width:fit-content;max-width:100%;margin:6px auto 0;border:1.5px solid #d3c1b4;border-radius:999px;background:#fff;overflow:hidden}
  .exits button{background:none;border:none;color:var(--ink);font-size:14px;font-weight:800;min-height:42px;padding:4px 18px;cursor:pointer;white-space:nowrap}
  .exits button:active{background:var(--paper)}
  .exits i{width:1.5px;background:#e3d6cc;margin:9px 0}
  .dock-act .btn.full + .exits{margin-top:8px}
  /* B 案：これまでの投稿 */
  .plog{border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:10px 0;background:#fff}
  .plog-hd{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);font-weight:700}
  .plog-hd b{color:var(--ink);font-size:13.5px;font-weight:900}
  .plog-t{white-space:pre-wrap;font-size:15px;line-height:1.7;margin:6px 0 4px}
  .plog-hd button{margin-left:auto;min-height:36px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--brown);background:#fff;color:var(--brown);font-weight:900;font-size:13px;cursor:pointer}
  .plog-note{font-size:12px;color:var(--dim);line-height:1.6}
  /* B 案：2 本目以降の原石は 1 行 */
  .done-line{display:flex;justify-content:center;margin:10px 0}
  .done-line span{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:#fff;box-shadow:var(--sh-1);font-size:13.5px;font-weight:800}
  .done-line svg{width:22px;height:26px}
  .hint-box{margin-top:10px}
  .hint-box .lab{margin-top:0}
  /* 選ぶ欄の頭：最大○つ・いまの数 */
  .pickhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 2px 8px}
  .hint-box .pickhd{margin-top:2px}
  .pickhd b{font-size:14px;font-weight:900;color:var(--ink)}
  .maxpill{font-size:12.5px;font-weight:900;color:#fff;background:var(--brown);border-radius:999px;padding:3px 10px;white-space:nowrap}
  .dots{display:inline-flex;gap:4px;align-items:center}
  .dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--brown);background:#fff}
  .dots i.on{background:var(--brown)}
  .pickhd .left{font-size:12.5px;font-weight:800;color:var(--ink-2)}
  .chips.full .chip:not(.on){opacity:.42}
  /* ぽとりの確かめ（だれと・しめ）：白い吹き出し */
  .say{display:flex;gap:8px;align-items:flex-start}
  .say .avatar{width:30px;height:30px;box-shadow:none}
  .say .avatar svg{width:26px;height:26px}
  .say p{margin:0;flex:1;background:#fff;border-radius:4px 18px 18px 18px;padding:10px 14px;font-size:15.5px;line-height:1.6;box-shadow:var(--sh-1)}
  .say p b{font-weight:900}
  .warnbox{border-radius:14px;background:#fff4e5;border:1.5px solid #f0c27a;padding:10px 12px;font-size:14.5px;line-height:1.6;color:#5c4300;margin-top:8px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .row.center{justify-content:center}
  /* ボタン：主ボタン＝こげ茶のまる（DROP のサイトと同じ）／ほか＝白 */
  .btn{min-height:52px;padding:0 22px;border:none;border-radius:999px;background:var(--brown);color:#fff;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .btn svg{width:20px;height:20px}
  .btn .go{display:inline-flex;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--brown);align-items:center;justify-content:center;margin-right:-10px;margin-left:4px}
  .btn .go svg{width:16px;height:16px}
  .btn:disabled{background:#e7ddd5;color:#7a6b62;cursor:default}
  .btn:disabled .go{color:#e7ddd5;background:#a3938a}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn.plain{background:var(--paper);color:var(--ink-2)}
  .btn.sm{min-height:46px;padding:0 16px;font-size:14.5px}
  .btn.wide{flex:1}
  .btn.full{width:100%}
  .btn.text{background:none;color:var(--ink-2);padding:0 12px;min-width:84px;font-size:15px}
  .lnk{background:none;border:none;color:var(--ink-2);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:10px 6px;min-height:44px}
  .inrow{position:relative}
  .input{display:block;width:100%;min-height:52px;max-height:150px;overflow-y:hidden;border:1.5px solid var(--line);border-radius:22px;padding:13px 60px 13px 16px;font-size:17px;line-height:1.5;outline:none;resize:none;background:#fff;color:var(--ink)}
  .input:focus{border-color:var(--brown);box-shadow:0 0 0 4px rgba(78,59,56,.1)}
  .input::placeholder{color:#8f8177;font-weight:500}
  .send{position:absolute;right:6px;bottom:6px;width:42px;height:42px;border-radius:50%;border:none;background:var(--brown);color:#fff;display:flex;align-items:center;justify-content:center}
  .send:disabled{background:#e7ddd5;color:#a3938a}
  .send svg{width:20px;height:20px}
  .lab{font-size:13px;font-weight:800;color:var(--ink-2);margin:12px 0 6px}
  .cnt-sm{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-left:auto}
  .scale{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
  .scale button{height:50px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:16px;padding:0}
  .scale button:active,.scale button.on{background:var(--brown);border-color:var(--brown);color:#fff}
  .scale-lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-top:5px;padding:0 2px}
  .login{display:grid;gap:10px}
  .login .input{padding-right:16px}
  .err{font-size:14px;color:var(--err);min-height:1em}
  .wait{display:flex;align-items:center;gap:10px;justify-content:center;font-size:15px;color:var(--ink-2);min-height:54px}
  .spin{width:20px;height:20px;border:2.5px solid #dccbbf;border-top-color:var(--brown);border-radius:50%;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .hint{font-size:12.5px;color:var(--dim);margin-top:6px}
  .photo-tile{width:100%;min-height:118px;border:2px dashed #d3c1b4;border-radius:22px;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .photo-tile svg{width:30px;height:30px;color:var(--ink-2)}
  .photo-tile b{font-size:17px;font-weight:900}
  .photo-tile small{font-size:12.5px;color:var(--ink-2);font-weight:700}
  .photo-tile.over{background:var(--paper);border-style:solid;border-color:var(--brown)}

  /* ---------- トースト・シート ---------- */
  .toast{position:fixed;left:50%;top:84px;transform:translateX(-50%) translateY(-10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14.5px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(43,33,29,.5);display:none;align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .sheet-hd b{font-size:18px;font-weight:900}
  .sheet-hd .icon-btn{margin-left:auto}
  /* B 案：右上は「≡ メニュー」の文字入り */
  .menu-btn{width:auto;padding:0 10px 0 8px;gap:4px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:800;color:var(--ink);height:40px}
  .menu-btn svg{width:18px;height:18px}
  .menu-btn span{white-space:nowrap}
  @media (max-width:360px){ .menu-btn{padding:0 8px 0 6px;font-size:12.5px} .top-r{gap:4px} }
  .sheet p{margin:0 0 12px;font-size:15px;color:var(--ink-2);line-height:1.7}
  .draft{border-radius:18px;padding:14px 16px;font-size:17px;line-height:1.85;white-space:pre-wrap;color:var(--ink);background:#fff}
  .mat{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
  .mat span{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;border-radius:999px;padding:5px 12px 5px 6px;background:#fff;color:var(--dim)}
  .mat span svg{width:20px;height:20px}
  .mat span.on{color:var(--ink)}
  .sec-h{font-size:14px;font-weight:900;color:var(--ink);margin:16px 0 8px}
  .ex{display:flex;gap:12px;border-radius:18px;padding:10px;background:#fff;margin-top:8px}
  .ex img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none;background:var(--bg-2)}
  .ex p{margin:0;font-size:15px;line-height:1.65;white-space:pre-wrap;color:var(--ink)}
  .want{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:16px;padding:10px 12px;margin-top:8px}
  .want b{display:block;font-size:15px}
  .want small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .want a{margin-left:auto;white-space:nowrap;font-size:13.5px;font-weight:800;color:var(--ink)}
  @media (min-width:700px){ .modal{align-items:center} .sheet{border-radius:26px;max-height:86vh} }

/* ---------- 回答シート：たたむ・ひらく（灰色の線を押す／下へスワイプでたたむ。同じ問いのあいだは状態を保つ） ---------- */
function dock(html, act, head, mini) {
  const key = (S ? S.phase + ":" + (S.cur || "") : "") + (mini ? "" : ":wait");
  if (key !== RT.dockKey) RT.collapsed = false;
  RT.dockKey = key;
  const d = $("dockIn");
  d.innerHTML = `<button type="button" class="grab" id="dGrab" aria-label="答える欄をたたむ" aria-expanded="true"></button>` +
    `<div class="dock-mini" id="dMini">${mini || '<span class="mq">答える欄</span><span class="mo">ひらく ▲</span>'}</div>` +
    (head ? `<div class="dock-head">${head}</div>` : "") + `<div class="dock-scroll" id="dockScroll">${html}</div>` + (act ? `<div class="dock-act">${act}</div>` : "");
  bindGrab(); setCollapsed(RT.collapsed, true);
  syncDockH(); if (!document.body.classList.contains("editing") && !RT.collapsed) scrollEnd();   // 回答エリアの高さが変わっても最後の問いが隠れないように
}
function setCollapsed(c, quiet) {
  RT.collapsed = !!c;
  const d = $("dockIn"), g = $("dGrab");
  d.classList.toggle("collapsed", RT.collapsed);
  if (g) { g.setAttribute("aria-expanded", String(!RT.collapsed)); g.setAttribute("aria-label", RT.collapsed ? "答える欄をひらく" : "答える欄をたたむ（会話を見る）"); }
  if (RT.collapsed && document.activeElement && d.contains(document.activeElement)) document.activeElement.blur();
  if (!quiet) { syncDockH(); if (!RT.collapsed) scrollEnd(); }
}
function bindGrab() {
  let y0 = null, moved = false;
  const down = e => { y0 = e.clientY; moved = false; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {} };
  const move = e => { if (y0 != null && Math.abs(e.clientY - y0) > 8) moved = true; };
  const up = e => {
    if (y0 == null) return;
    const dy = e.clientY - y0; y0 = null;
    if (dy > 28) setCollapsed(true); else if (dy < -28) setCollapsed(false); else if (!moved) setCollapsed(!RT.collapsed);
  };
  ["dGrab", "dMini"].forEach(id => {
    const el = $(id); if (!el) return;
    el.addEventListener("pointerdown", down); el.addEventListener("pointermove", move); el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", () => { y0 = null; });
  });
  $("dGrab").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setCollapsed(!RT.collapsed); } });
}
/** B 案：手が止まったら（入力欄が空・何も選んでいない・ヒントを閉じたまま NUDGE_SEC 秒）ヒントのボタンを光らせ、ぽとりが小さく声をかける。1 つの問いで 1 回だけ */
function clearNudge() { clearTimeout(RT.nudgeT); RT.nudgeT = null; }
function armNudge(st, ta) {
  clearNudge();
  RT.nudged = RT.nudged || {};
  if (RT.nudged[st.id] || RT.hintOpen[st.id]) return;
  const idle = () => !ta.value.trim() && !RT.sel.length && !RT.hintOpen[st.id];
  const start = () => {
    clearNudge();
    if (!idle()) return;
    const sid = S && S.sid;
    RT.nudgeT = setTimeout(() => {
      if (!S || S.sid !== sid || !idle() || S.cur !== st.id || S.phase !== "ask" || !$("dHint") || !$("dNudge")) return;
      RT.nudged[st.id] = true; S.nudges = (S.nudges || []).concat(st.id); save();
      $("dHint").classList.add("nudge");
      $("dNudge").outerHTML = `<span class="nudge-tip" role="status"><span class="av">${charSvg()}</span>${esc(T("nudge"))}</span>`;
    }, (CONFIG.NUDGE_SEC || 5) * 1000);
  };
  ta.addEventListener("input", start);
  start();
}
function lockDock() { RT.busy = true; dock(`<div class="wait"><span class="spin"></span></div>`); }
function syncDockH() { document.documentElement.style.setProperty("--dockH", $("dock").offsetHeight + "px"); }
if ("ResizeObserver" in window) new ResizeObserver(syncDockH).observe($("dock"));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { const t = $("dIn"); if (t && t._grow) t._grow(); });
/* スマホのキーボード：答える欄がキーボードの下に隠れないように持ち上げる（iPhone の Safari 向け） */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const fit = () => { const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop); $("dock").style.bottom = kb > 60 ? kb + "px" : "0px"; syncDockH(); };
  vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit);
}

/* =====================================================================
   チャットの進行
===================================================================== */
async function ask(st) {
  const g = RT.gen;
  S.cur = st.id; S.phase = "ask";
  if (!S.asked.includes(st.id)) S.asked.push(st.id);
  S.times[st.id] = { shown: now() };
  if (st.opts && SET.pending) { await Promise.race([SET.pending, new Promise(r => setTimeout(r, CONFIG.SETTINGS_TIMEOUT_MS))]); if (g !== RT.gen) return; }
  if (st.id === "photo" && !S.startSent) { S.startSent = true; save(); sendLog("start"); }   // 始めた記録（ひとことの前にやめた人も数える）
  if (st.id === "why") S.whyFor = whyFor();
  if (st.kind === "reflect" && S.reflect && S.reflect.status === "待ち") {   // まだ届いていなければ少し待つ（届かなければとばす）
    RT.typing = true; RT.typingText = T("reflect_wait"); renderMsgs();
    const t0 = now();
    while (S.reflect && S.reflect.status === "待ち" && now() - t0 < CONFIG.REFLECT_WAIT_MS) { await sleep(250); if (g !== RT.gen) return; }
    RT.typing = false; RT.typingText = ""; renderMsgs();
  }
  if (st.kind === "reflect" && !(S.reflect && S.reflect.status === "OK" && (S.reflect.options || []).length)) {
    if (S.reflect) { S.reflect.status = "none"; S.reflect.how = S.reflect.how || "出なかった"; }
    markDone(st); if (!S.skipped.includes(st.id)) S.skipped.push(st.id); save();
    return advance(st.id, g);
  }
  if (st.optional && !S.optIntro) {   // 原石ができたことを伝えてから、そのまま任意の問い（ひみつの部屋）へ
    S.optIntro = true;
    showDone();
    if (!await bot(T("opt_intro"), { sub: T("opt_intro_sub") })) return;
  }
  enterRoom(st.id);
  if (st.opts) prepareOrder(st);
  setSelFromAns(st);
  RT.confirm = null; RT.reflectEdit = null;
  const sub = st.sub ? st.sub() : "";
  await bot(st.q(), sub ? { sub, qid: st.id } : { qid: st.id });
  if (g !== RT.gen) return;
  RT.busy = false; renderDock(); save();
}
async function advance(fromId, g = RT.gen) {
  if (g !== RT.gen) return;
  const n = nextStepAfter(fromId);
  if (n) await ask(n); else await toCompose(false);
}
/** 部屋に入る（1 回だけ区切りを出す） */
function enterRoom(id) {
  if (!ROOM[id] || (S.rooms || []).includes(id)) return;
  S.rooms = (S.rooms || []).concat(id);
  if (S.compact) { renderProgress(); return; }   // B 案：2 本目以降は部屋の区切りをチャットに流さない（上の地図だけ）
  S.msgs.push({ who: "sys", room: id }); renderMsgs();
}
/** かけらゲット（自分のことばならキラ✦）／見送り */
function gotPiece(id, miss) {
  const r = ROOM[id]; if (!r || (r.i == null && !r.rare)) return;
  if (S.compact) { if (!miss) buzz(); return; }   // B 案：2 本目以降はかけらゲットをチャットに流さない（上の地図の宝石が光る）
  if (miss) { if (r.i != null) S.msgs.push({ who: "sys", get: id, miss: true }); return; }
  S.msgs.push({ who: "sys", get: id, kira: isKira(id) }); buzz();
}
/** DROP の原石（5 つのかけら）。任意の問いの前、または投稿文の前に 1 回だけ */
function showDone() {
  if (S.doneShown || !PIECES.some(([id]) => pieceOn(id))) return;
  S.doneShown = true; S.msgs.push({ who: "sys", done: true }); renderMsgs(); save();
}
function markDone(st) { if (!S.done.includes(st.id)) S.done.push(st.id); const t = S.times[st.id]; if (t) t.answered = now(); }
async function answered(st, display, extra) {
  markDone(st); S.skipped = S.skipped.filter(x => x !== st.id);
  if (display != null) { S.msgs.push({ who: "me", text: display, ...(extra || {}) }); gotPiece(st.id); renderMsgs(); save(); }
  if (st.id === "why") fireReflect();   // 「だれと」に答えているあいだに「そうそう！」を用意する
  lockDock(); await advance(st.id);
}
async function skipStep(st) {
  if (RT.busy) return;
  if (st.id === "profile") LS.set(CONFIG.KEYS.PROFILE, { id: "none", label: "答えない" });
  if (st.id === "reflect" && S.reflect) S.reflect.how = "とばした";
  if (!S.skipped.includes(st.id)) S.skipped.push(st.id);
  markDone(st); S.msgs.push({ who: "me", text: "とばす", muted: true }); gotPiece(st.id, true); renderMsgs(); save();
  if (st.id === "why") fireReflect();
  lockDock(); await advance(st.id);
}
async function exitEarly() {
  if (RT.busy) return;
  S.early = true; me("ここで投稿文へ", { muted: true }); lockDock(); await toCompose(true);
}
function prepareOrder(st) {
  if (S.order[st.id]) return;
  const list = (st.id === "why" ? whyList() : V[st.opts]).filter(x => !x.hidden);
  const body = list.filter(x => !x.fixed), tail = list.filter(x => x.fixed);
  S.order[st.id] = (CONFIG.SHUFFLE ? shuffle(body) : body).concat(tail).map(x => x.id);
}
/** ヒントの候補：AI が写真とひとことから作った候補 → 運営の選択肢（表示順はシャッフル）→ ふつう・とくにない など（末尾に固定） */
function optionsOf(st) {
  const list = (st.id === "why" ? whyList() : V[st.opts]).filter(x => !x.hidden);
  const ordered = (S.order[st.id] || []).map(id => list.find(x => x.id === id)).filter(Boolean);
  list.forEach(x => { if (!ordered.includes(x)) ordered.push(x); });
  const ai = AI_KEY[st.id] && S.hint ? (S.hint[AI_KEY[st.id]] || []) : [];
  const aiItems = ai.filter(l => !ordered.some(b => b.label === l)).map(l => ({ id: "ai:" + l, label: l, ai: true, layer: "コンテンツ", w: W0() }));
  return aiItems.concat(ordered.filter(x => !x.fixed), ordered.filter(x => x.fixed));
}
/** 選択の初期値：答えたことがあればそれ。気持ちは、ひとことから読み取ったものを先に選んでおく */
function setSelFromAns(st) {
  if (st.kind !== "free") { RT.sel = []; return; }
  RT.hintOpen[st.id] = false;
  if (st.id === "who") { RT.sel = S.ans.who ? [{ id: S.ans.who.id, label: S.ans.who.label }] : []; RT.freeText.who = S.own.who || ""; return; }
  const a = S.ans[st.id] || [];
  if (a.length || S.own[st.id]) { RT.sel = a.filter(x => x.id !== "other").map(x => ({ ...x })); RT.freeText[st.id] = S.own[st.id] || ""; }
  else if (st.id === "feel" && S.det.feels.length) { RT.sel = S.det.feels.map(id => ({ id, label: item("feel", id).label, pre: true, src: "ひとことから" })); RT.freeText.feel = ""; }
  else { RT.sel = []; RT.freeText[st.id] = ""; }
}

/* ---------- 回答エリア ---------- */
/** 問いの頭：いまの部屋（かけらの色）。数（1/5 など）は出さない */
function stepBadge(st) {
  const r = ROOM[st.id];
  if (r && r.i != null) return `<span class="q-step">${gemSvg(r.i, "now")}${esc(r.name)}</span>`;
  if (r && r.rare) return `<span class="q-step opt">${gemSvg(0, "rare")}${esc(r.name)}（任意）</span>`;
  if (st.id === "reflect") return `<span class="q-step">${ICON.spark}${esc(r.name)}</span>`;
  if (st.id === "profile") return '<span class="q-step">さいごに</span>';
  return "";
}
function renderDock() {
  if (!S) return;
  if (S.phase === "compose") return renderComposeDock();
  const st = stepOf(S.cur);
  if (!st) { dock(""); return; }
  const rest = remainingSteps().length;
  const canExit = S.done.includes("text1") && !["login", "reflect"].includes(st.kind) && rest > 0 && !st.optional;
  // 回答シート：頭（何問目・どう答えるか・ここで投稿文へ）／入力・ヒント（スクロール）／ボタン（いつも同じ場所）
  const badge = stepBadge(st);
  const ins = { text: st.required ? "必ず書いてください（短くてOK）" : "", photo: "1枚えらぶ", scale: "1〜10", login: "この端末で1回だけ", single: "1つえらぶ", free: "自分のことばで", reflect: "1つえらぶ" }[st.kind] || "";
  const qm = [...S.msgs].reverse().find(m => m.qid === st.id);
  const head = `<div class="q-card"><div class="avatar">${charSvg()}</div><div class="qc"><div class="q-meta">${badge}<span class="q-ins">${esc(ins)}</span></div>
    ${qm ? `<div class="q-title">${esc(qm.text)}</div>${qm.sub ? `<div class="q-sub">${esc(qm.sub)}</div>` : ""}` : ""}</div></div>`;
  const mini = `${badge}<span class="mq">${esc(qm ? qm.text : stepName(st.id))}</span><span class="mo">答える ▲</span>`;
  const skipBtn = `<button type="button" class="btn text" id="dSkip">とばす</button>`;
  // B 案：とばす・ここで投稿文へは、いちばん下の白い囲みに 1 行（主ボタンは入力欄の →）
  const exits = `<div class="exits"><button type="button" id="dSkip">この問いをとばす</button>${canExit ? `<i aria-hidden="true"></i><button type="button" id="dExit">ここで投稿文へ</button>` : ""}</div>`;
  const tile = (o, on, mark) => `<button type="button" class="chip${on ? " on" : ""}${o.ai ? " ai" : ""}${String(o.label).length > 10 ? " wide" : ""}" data-id="${esc(o.id)}" aria-pressed="${!!on}"><span>${o.ai ? `<small>${hasPhoto() ? "写真から" : "AIの案"}</small>` : ""}${esc(o.label)}</span>${mark || ""}</button>`;

    act = `<div class="row center" style="margin-top:0"><button type="button" class="lnk" id="dNoPhoto">写真なしで進む</button></div>`;
  } else if (st.kind === "text") {
    html = `<div class="inrow"><textarea class="input" id="dIn" rows="2" maxlength="${st.max}" placeholder="${esc(st.ph ? st.ph() : "")}" enterkeyhint="send"></textarea><button type="button" class="send" id="dSend" aria-label="送る" disabled>${ICON.send}</button></div>
      <div class="row" style="margin-top:6px"><span class="pii" style="margin:0">${esc(PII_SHORT)}</span><span class="cnt-sm" id="dCnt">0 / ${st.max}</span></div><div class="err" id="dErr"></div>${st.required ? "" : `<div class="row">${skipBtn}</div>`}`;
  } else if (st.kind === "free" && RT.confirm && RT.confirm.step === st.id) {
    // だれと・しめ：書いたことばを区分に当てはめて、本人に確かめる（ちがえば選び直す）
    const c = RT.confirm, labs = c.picks.map(id => (item(st.opts, id) || {}).label).filter(Boolean);
    const short = c.text.length > 16 ? c.text.slice(0, 15) + "…" : c.text;
    if (c.mode === "confirm") {
      html = `<div class="say"><div class="avatar">${charSvg()}</div><p>${esc(T(st.id === "who" ? "who_confirm" : "next_confirm", { t: short, l: labs.join("」「") }))}</p></div>`;
      act = `<div class="row"><button type="button" class="btn ghost wide" id="dNo">ちがう</button><button type="button" class="btn wide" id="dYes">OK</button></div>`;
    } else {
      html = `<div class="say"><div class="avatar">${charSvg()}</div><p>「${esc(short)}」──${esc(T("pick_q"))}</p></div>${pickHead(c.picks.length, st.max, "近いものをえらぶ")}<div class="chips${st.max > 1 && c.picks.length >= st.max ? " full" : ""}">${V[st.opts].filter(x => !x.hidden).map(o => { const k = c.picks.indexOf(o.id); return tile(o, k >= 0, k >= 0 ? `<span class="ck">✓</span>` : ""); }).join("")}</div><div class="hint" id="dMax" hidden>${st.max > 1 ? `選べるのは${st.max}つまでです` : ""}</div>`;
      act = `<div class="row"><button type="button" class="btn text" id="dBack">書きなおす</button><button type="button" class="btn wide" id="dYes" ${c.picks.length ? "" : "disabled"}>次へ</button></div>`;
    }

function drawToDataUrl(src, w, h, edge, quality) {
  const k = Math.min(1, edge / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(src, 0, 0, c.width, c.height);

      final: S.phase === "compose" ? finalText() : "", chosen: draftIdx(S.chosen) >= 0 ? "AI" + tabLabel(S.chosen) : S.chosen, edited: isEdited() },
    coach_level: coachLevel(),
    // 分析用の読み取りは、選んだ AI の案（AI の案を選んでいなければ最後の案）
    ai: S.ai ? { status: S.ai.status, message: S.ai.message, cached: S.ai.cached, model: S.ai.model, prompt_version: S.ai.prompt_version, elapsed_sec: S.ai.elapsed_sec, result: cd ? cd.result : ((S.drafts || []).slice(-1)[0] || {}).result || S.ai.result } : { status: "" },
    hint: { status: h.status || "", elapsed_sec: h.elapsed_sec, cached: !!h.cached, subject: h.subject || "", feel_options: h.feel_options || [], why_options: h.why_options || [], find_options: h.find_options || [], shime_options: h.shime_options || [] },
    own: S.own || {}, src: S.src || {},
    reflect: S.reflect ? { status: S.reflect.status || "", options: S.reflect.options || [], text: S.reflect.text || "", how: S.reflect.how || (S.reflect.status === "none" ? "出なかった" : ""), elapsed_sec: S.reflect.elapsed_sec ?? null } : { status: "", text: "", how: "" },
    ai_calls: (S.calls || []).slice(),   // v5.6：AI の呼び出しごとの 時刻・種類（ヒント／みがきの間／投稿文）・待ち時間・結果
    line_swaps: S.lineSwaps || 0, company_view: S.companyView || "", secret_visits: S.secretVisits || 0, no_copy: !!S.noCopy,
    // v5：かけら集め（自分のことば＝キラ・任意の問い＝レア）・おまけの宝箱（おすすめ）
    game: { kira: kiraCount(), rare: rareCount(), pieces: PIECES.filter(([id]) => pieceOn(id)).length },
    rec: S.rec ? { opened: !!S.rec.opened, skipped: !!S.rec.skipped, picks: (S.rec.picks || []).map(p => ({ id: p.id, kind: p.kind })), hist: S.rec.hist || [], shown: S.rec.shown || [], clicked: S.rec.clicked || [], saved: S.rec.saved || [], rerolls: S.rec.rerolls || 0, opened_at_sec: S.rec.openedAt ?? null } : null,
    example_views: S.exViews || [], preview_opens: S.previewOpens || 0,
    why_for: S.whyFor || "", settings_version: SETTINGS_VER,
    extra: optState(), chat_rating: S.rating || null, chat_comment: S.ratingComment || "",
    post_no: S.postNo || (postStats().n + 1), post_total: S.postTotal || (postStats().total + 1),   // この端末でコピーした本数（今日・通算）。コピー前は「次にコピーすれば何本目か」
    order: S.order, step_sec: stepSec, big_text: document.documentElement.classList.contains("big")
  };
}
async function sendLog(end) {
  if (!S) return;
  const rec = buildRecord(end);
  if (STAFF) pushHistory(rec);
  if (!logOn()) return;
  const key = end + "|" + rec.texts.final + "|" + (rec.chat_rating || "") + "|" + rec.chat_comment + "|" + rec.company_view + "|" + JSON.stringify(rec.rec || "");
  if (S.loggedKey === key) return;
  let tok = getToken(CONFIG.KEYS.LOG_TOKEN);
  if (!tok && await autoLogin()) tok = getToken(CONFIG.KEYS.LOG_TOKEN);
  if (!tok) return;
  let r = await post({ action: "log", token: tok, session: rec }, CONFIG.LOG_URL);
  if (!r.ok && r.code === "AUTH") { LS.del(CONFIG.KEYS.LOG_TOKEN); if (await autoLogin()) r = await post({ action: "log", token: getToken(CONFIG.KEYS.LOG_TOKEN), session: rec }, CONFIG.LOG_URL); }
  if (r.ok) { if (end !== "start") S.logged = true; S.loggedKey = key; save(); } else console.warn("記録できませんでした", r);
  renderStaff();
}
/* 画面を閉じたとき：始めた記録があって、そのあと記録していなければ「途中離脱」として送る（どの問いでやめたかを数えるため） */
window.addEventListener("pagehide", () => {
  if (!S || S.logged || S.abandonSent || !S.startSent || !logOn()) return;
  const tok = getToken(CONFIG.KEYS.LOG_TOKEN); if (!tok) return;
  try {
    const body = JSON.stringify({ action: "log", token: tok, session: buildRecord("abandon") });
    if (navigator.sendBeacon(CONFIG.LOG_URL, new Blob([body], { type: "text/plain;charset=utf-8" }))) { S.abandonSent = true; save(); }
  } catch (e) {}
});

/* ---------- スタッフ用（?staff=1） ---------- */
function pushHistory(rec) {
  const h = LS.get(CONFIG.KEYS.HISTORY, []), i = h.findIndex(x => x.session_id === rec.session_id);
  if (i >= 0) h[i] = rec; else h.push(rec);
  LS.set(CONFIG.KEYS.HISTORY, h.slice(-300));
}
function renderStaff() {
  const box = $("after");
  if (!STAFF || !S || S.phase !== "compose") { box.innerHTML = ""; return; }
  const rec = buildRecord("preview"), s = rec.soft, n = LS.get(CONFIG.KEYS.HISTORY, []).length;
  box.innerHTML = `<div class="card staff">
    <div class="card-hd"><b>分析用の記録（スタッフ用）</b></div>
    <table>
      <tr><td>関与・時間</td><td>${esc(rec.coach_level)}・${rec.answered}問・${Math.round(rec.duration_sec)}秒</td></tr>
      <tr><td>読み取り</td><td>${esc(JSON.stringify(rec.detected))}</td></tr>
      <tr><td>ノード</td><td>${esc(rec.nodes.join("｜") || "−")}</td></tr>
      <tr><td>気持ちの向き</td><td>${rec.valence ?? "−"}</td></tr>
      <tr><td>ソフト分類</td><td><div class="bars">${Object.keys(SOFT_LABEL).map(k => `<span>${SOFT_LABEL[k]}</span><s><u style="width:${Math.round(s[k] * 100)}%"></u></s><span>${s[k].toFixed(2)}</span>`).join("")}</div></td></tr>
      ${rec.ai.status === "OK" && rec.ai.result ? `<tr><td>AI 読み取り</td><td>${esc((rec.ai.result.category || {}).label || "")}／${esc(ACT_LABEL[rec.ai.result.act] || "")}／${esc((rec.ai.result.content || []).join("・"))}／向き ${rec.ai.result.sentiment}</td></tr>` : ""}
      <tr><td>ヒント</td><td>${esc(rec.hint.status)} ${rec.hint.elapsed_sec ?? ""}秒 ${esc(rec.hint.subject)} ${esc((rec.hint.why_options || []).join("・"))}</td></tr>
      <tr><td>そうそう</td><td>${esc(rec.reflect.how)} ${esc(rec.reflect.text)}</td></tr>
      <tr><td>決め方</td><td>${esc(Object.entries(rec.src).map(([k, v]) => stepName(k) + "=" + v).join("／"))}</td></tr>
      <tr><td>端末</td><td>${esc(rec.device_id)}・今日${rec.post_no}・通算${rec.post_total}</td></tr>
    </table>
    <details style="margin-top:8px"><summary style="font-size:13px;cursor:pointer">記録 JSON</summary><pre>${esc(JSON.stringify(rec, null, 1))}</pre></details>
    <div class="row"><button type="button" class="btn sm ghost" id="sJson">JSON をコピー</button><button type="button" class="btn sm ghost" id="sCsv">この端末の記録を CSV で保存（${n}件）</button></div>
  </div>`;
  $("sJson").addEventListener("click", async () => { try { await navigator.clipboard.writeText(JSON.stringify(rec)); toast("コピーしました"); } catch (e) { toast("コピーできませんでした"); } });
  $("sCsv").addEventListener("click", downloadCsv);
}
function downloadCsv() {
  const h = LS.get(CONFIG.KEYS.HISTORY, []);
  if (!h.length) { toast("まだ記録がありません"); return; }
  const L = a => (a || []).map(x => x.label).join("、");
  const cols = [["セッションID", r => r.session_id], ["開始", r => r.started_at], ["終了", r => r.end], ["所要秒", r => r.duration_sec], ["回答数", r => r.answered],
    ["写真", r => (r.has_photo ? "あり" : "なし")], ["最初のひとこと", r => r.text1], ["話題", r => r.subject], ["だれと", r => r.answers.who.label], ["どんな人", r => r.answers.who.detail],
    ["どこが", r => L(r.answers.why)], ["気持ち", r => L(r.answers.feel)], ["気持ちの向き", r => r.valence ?? ""], ["しめ", r => L(r.answers.next)],
    ["属性", r => (r.answers.profile || {}).label || ""], ["ノード", r => r.nodes.join("｜")], ["ソフト①", r => r.soft.c1], ["ソフト②", r => r.soft.c2], ["ソフト③", r => r.soft.c3], ["ソフト愛着", r => r.soft.att],
    ["最終文面", r => r.texts.final], ["採用", r => r.texts.chosen], ["手で編集", r => (r.texts.edited ? "あり" : "なし")], ["コーチ関与", r => r.coach_level]];
  const cell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = "﻿" + [cols.map(c => c[0]).join(","), ...h.map(r => cols.map(c => cell(c[1](r))).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `drop_chat_v4_${jstDate()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

  }

}

function syncMenu() { $("mLogout").hidden = !(getCreds() || hasTokensAny()); $("mBig").textContent = document.documentElement.classList.contains("big") ? "文字を標準にもどす" : "文字を大きく"; }

    <p><b>答えの使い道：</b>答えと投稿文は、CULTURE SNACK の効果を確かめる分析にだけ使います。投稿文は、あなたがコピーして DROP に投稿するまで公開されません。ニックネームは分析画面にだけ表示されます。分析では、この端末につけたランダムな番号（端末 ID）とニックネームで人数を数えます。</p>
    <div class="row"><button type="button" class="btn full" id="shBack">もどる</button></div>`);
  $("shBack").addEventListener("click", closeModal);

  closeMenu(); LS.del(CONFIG.KEYS.PROFILE); toast("次の投稿のさいごに、もう一度聞きます");
  if (S && S.phase === "ask") { S.done = S.done.filter(x => x !== "profile"); renderProgress(); }
});
$("mLogout").addEventListener("click", () => { closeMenu(); [CONFIG.KEYS.TOKEN, CONFIG.KEYS.LOG_TOKEN, CONFIG.KEYS.PW, POSTLOG_KEY].forEach(k => LS.del(k)); syncMenu(); toast("ログアウトしました（保存したパスワードも削除しました）"); });
async function restart() {
  if (S && !S.logged && S.ans.text1 && S.phase === "compose") sendLog("reset");
  closeModal(); start();
}

/* ---------- 設定（選択肢と重み）を記録用 GAS から読む ---------- */
const SET = { pending: null, next: null };
const optionStepsStarted = () => !!S && ["feel", "why", "who", "next", "find", "face"].some(id => S.asked.includes(id));
function loadSettings() {
  const cached = LS.get(CONFIG.KEYS.SETTINGS, null);
  if (cached && cached.settings) applySettings(cached.settings, cached.version);
  if (!logOn()) return;
  SET.pending = post({ action: "settings" }, CONFIG.LOG_URL, CONFIG.SETTINGS_TIMEOUT_MS).then(r => {
    SET.pending = null;
    if (!r || !r.ok) return;   // 古い GAS（設定に未対応）・通信エラー → いまの設定のまま
    const ver = r.settings ? String(r.version || "") : "初期値";
    if (r.settings) LS.set(CONFIG.KEYS.SETTINGS, { settings: r.settings, version: ver }); else LS.del(CONFIG.KEYS.SETTINGS);
    if (ver === SETTINGS_VER) return;
    if (optionStepsStarted()) SET.next = { settings: r.settings, version: ver };   // 答えている途中は変えず、次のチャットから
    else applySettings(r.settings || DEFAULT_SETTINGS, ver);
  });
}

/* ---------- 起動 ---------- */
function warmLogin() { if (anyGas() && getCreds() && !hasTokens()) autoLogin().catch(() => {}); }
async function start() {
  RT.gen++; RT.typing = false; RT.typingText = "";
  SS.del(CONFIG.KEYS.PHOTO); PHOTO = { img: "", imgAi: "", w: 0, h: 0 };
  if (SET.next) { applySettings(SET.next.settings || DEFAULT_SETTINGS, SET.next.version); SET.next = null; }
  S = newSession(); S.compact = postStats().total >= 1; RT.rendered = 0;   // B 案：通算 1 本以上なら演出を短く RT.busy = true; RT.aiWait = false; RT.loginFor = null;
  save(); renderMsgs(); renderStaff(); lockDock(); warmLogin();
  const g = RT.gen;
  const ps = postStats();
  const h = { n: ps.n > 0 ? ps.n + 1 : 0, wl: wantList().length }, hp = helloParts(h);
  if (!await bot(hp[0], { sub: hp[1], hello: h })) return;
  if (h.n === 2) { S.msgs.push({ who: "sys", note: `※「${h.n}本目」は、この端末でコピーした投稿の数です（コピーしなかった投稿は数えません）` }); renderMsgs(); save(); }   // 本数の数え方：その日はじめて本数が出るときだけ。ぽとりのセリフにしない
  if (h.n && h.wl && !await bot(T("hello_want", { n: h.wl }), { want: true })) return;   // 行ってみるリストは吹き出しを分けて、ボタンで開ける
  S.msgs.push({ who: "bot", notice: true }); renderMsgs(); save();   // 個人情報のおねがい（毎回はじめに）
  await advance(null, g);
}
/** あいさつの文（2 本目以降。行ってみるリストは別の吹き出し、本数の数え方は吹き出しの外の注記） */
function helloParts(h) {
  if (!h || !h.n) return [String(T("hello1")), String(T("hello1sub"))];
  return [String(T("hello2", { n: h.n })), String(T("hello2sub"))];
}
/** それまでの会話を、いまの話し方で言いなおす（ぽとりのセリフ・あいさつ・問い。運営からのお知らせと、あなたの答えはそのまま） */
function relocalize() {
  if (!S) return;
  S.msgs.forEach(m => {
    if (m.who !== "bot") return;
    if (m.hello) { const hp = helloParts(m.hello); m.text = hp[0]; m.sub = hp[1]; return; }
    if (m.qid) { const st = stepOf(m.qid); if (st) { try { m.text = String(st.q()); const sb = st.sub ? String(st.sub()) : ""; if (sb) m.sub = sb; else delete m.sub; } catch (e) {} } return; }
    if (m.parts) m.text = m.parts.map(([k, a]) => String(T(k, a))).join("");   // いくつかのセリフをつないだ文
    else if (m.tk) m.text = String(T(m.tk, m.ta));
    if (m.sk) m.sub = String(T(m.sk, m.sa));
  });
  if (S.rec && S.rec.picks) S.rec.picks.forEach(p => { if (p.wk) p.why = String(T(p.wk, p.wa)); });
  save();
}
function restore() {
  const s = LS.get(CONFIG.KEYS.SESSION, null);
  if (!s || s.v !== 52 || !s.sid || now() - (s.t0 || 0) > CONFIG.RESUME_HOURS * 3600e3 || s.copied) return false;
  S = s; S.msgs = (S.msgs || []).filter(m => m && m.who);
  relocalize();   // 話し方が変わっていたら、いまの話し方で
  const p = SS.get(CONFIG.KEYS.PHOTO, null);
  if (p && p.sid === S.sid && /^data:image\/jpeg;base64,/.test(p.img || "")) PHOTO = p;
  RT.rendered = S.msgs.length; renderMsgs(); renderStaff(); warmLogin();
  if (S.hint && S.hint.status === "待ち") { S.hint = null; if (S.ans.text1 && S.phase === "ask") fireHint(); }
  if (S.reflect && S.reflect.status === "待ち") { S.reflect = null; if (S.done.includes("why") && S.phase === "ask") fireReflect(); }
  if (S.phase === "compose") {
    if (!S.msgs.some(m => m.card === "compose")) { lockDock(); finishCompose(false); return true; }
    renderComposeDock(); return true;
  }
  const st = stepOf(S.cur);
  if (!st || !applicable(st)) { lockDock(); advance(S.cur ? S.cur : null); return true; }
  if (st.opts) prepareOrder(st);
  setSelFromAns(st);
  RT.busy = false; renderDock();
  return true;
}
/* アプリ（LINE・Instagram・Facebook）の中のブラウザで開いたら、ふだんのブラウザで開くよう案内する（保存が別になり、毎回ログインが必要になるため） */
function checkInAppBrowser() {
  const ua = navigator.userAgent || "";
  const app = /\bLine\//i.test(ua) ? "LINE" : /Instagram/i.test(ua) ? "Instagram" : /FBAN|FBAV|FB_IAB/i.test(ua) ? "Facebook" : "";
  if (!app || SS.get(CONFIG.KEYS.IAB, false)) return;
  $("iabText").textContent = `${app} の中で開いています。右上のメニュー（… や ⋮）から「ブラウザで開く」を選ぶと、次から名前の入力なしで使えます`;
  $("iab").hidden = false;
  $("iabCopy").addEventListener("click", async () => { try { await navigator.clipboard.writeText(location.href); toast("URL をコピーしました。Safari や Chrome に貼りつけて開いてください"); } catch (e) { toast("コピーできませんでした"); } });
  $("iabX").addEventListener("click", () => { $("iab").hidden = true; SS.set(CONFIG.KEYS.IAB, true); });
}
(async () => {
  $("brandMark").innerHTML = charSvg();
  deviceId();
  checkInAppBrowser();
  $("staffFlag").hidden = !STAFF;
  syncVoiceBtn();
  if (LS.get(CONFIG.KEYS.BIG, false)) document.documentElement.classList.add("big");

    id: r.artwork_id, n: r.account_name || "", s: String(r.sentence || "").trim(), img: r.image_file_path || r.image_file_path_thumbnail || ""
  })).filter(p => p.s);
  if (!restore()) start();
})();
