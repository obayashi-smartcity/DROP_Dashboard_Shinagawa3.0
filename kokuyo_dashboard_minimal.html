<style>
  :root{--fg:#1f1e1d;--muted:#5e5d59;--bg:#faf9f5;--panel:#fff;--line:#e5e3dc;--struct:#0E3B4A;--accent:#0E3B4A;--accent-ink:#fff;--bad:#B42318;

  @media (prefers-color-scheme: dark){:root{--fg:#f0efea;--muted:#b7b5ad;--bg:#1f1e1d;--panel:#262624;--line:#3a3936;--struct:#9CC3D0;--accent:#9CC3D0;--accent-ink:#10242b;--bad:#F07070}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
  form{width:min(100%,420px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px}
  .badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin:0 0 10px}
  h1{font-size:19px;line-height:1.45;margin:0 0 6px;color:var(--struct)}
  p{margin:0 0 14px;font-size:14px;line-height:1.6}
  label[for=pw]{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
  input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);letter-spacing:.04em}
  input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 0;flex-wrap:wrap}
  .show{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  button{font:inherit;font-size:15px;font-weight:600;padding:8px 22px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
  button:disabled{opacity:.55;cursor:wait}
  #msg{min-height:1.6em;margin:10px 0 0;font-size:13.5px;font-weight:600;color:var(--bad)}
  #msg.wait{color:var(--muted);font-weight:400}
  .note{margin:8px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
</style>

    return;
  }
  $('sh').addEventListener('change', () => { $('pw').type = $('sh').checked ? 'text' : 'password'; });
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = norm($('pw').value);
    if (!pw) { msg('パスワードを入れてください'); return; }
    $('go').disabled = true;
    msg('開いています…', true);
    let page = null;
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bin(P.salt), iterations: P.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      page = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(P.iv) }, key, bin(P.ct)));
    } catch (err) {
      $('go').disabled = false;
      msg('パスワードが違います');
      $('pw').select();
      return;
    }
    document.open();
    document.write(page);
    document.close();
  });
})();
</script>
</body>
</html>
